name: verify-build
# Manual full verification on a networked runner. Produces the lockfile AND the real results report as artifacts.
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: bash scripts/verify-build.sh --self-test
      - run: bash scripts/verify-build.sh   # exit 0 VERIFIED, 1 FAILED (project), 2 INCOMPLETE (environment)
        env: { STEP_TIMEOUT: '2400' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verification, path: |
            pnpm-lock.yaml
            docs/BUILD-VERIFICATION.generated.md
            docs/BUILD-VERIFICATION.generated.json }
