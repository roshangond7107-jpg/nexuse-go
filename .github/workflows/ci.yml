name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require committed lockfile
        run: |
          test -f pnpm-lock.yaml || { echo "::error::pnpm-lock.yaml is missing. Run the 'generate-lockfile' workflow (or 'pnpm install' locally) and commit the result."; exit 1; }
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/verify-build.sh --self-test
      - run: pnpm check-secrets
      - run: pnpm check:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  database:
    # Applies migrations to a throwaway Postgres (with a local Supabase emulation shim) and runs the RLS suite.
    # Not a substitute for testing against a real Supabase project (see NEXT_STEPS.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | tail -1)" bash supabase/tests/run.sh
